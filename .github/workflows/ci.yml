name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and Lua dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lua5.4
      - name: Run every suite
        run: bash scripts/test-all.sh
